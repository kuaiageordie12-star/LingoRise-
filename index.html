<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LingoRise</title>
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LingoRise">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mu:#5b6478;--bl:#1e63e9;--rd:#e02b2b;--gn:#1fa84f;--bd:#dde2ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#152036;--tx:#eef2fb;--mu:#9aa6c0;--bd:#25324d}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.st{font-family:"Allerta Stencil",Stencil,Impact,sans-serif}
#sp{position:fixed;inset:0;background:#0b1220;display:flex;align-items:center;justify-content:center;z-index:9;transition:opacity 1s}
#sp h1{font-size:clamp(40px,12vw,80px);color:#F8F8FF;margin:0;opacity:0;animation:w 4.6s ease-in-out forwards}
@keyframes w{0%{opacity:0;letter-spacing:.3em}45%{opacity:1;letter-spacing:.08em}55%{opacity:1}100%{opacity:0;letter-spacing:.08em}}
#app{max-width:720px;margin:0 auto;padding:18px 16px 40px;opacity:0;transition:opacity 1.2s}
#app.on{opacity:1}
.hd{display:flex;align-items:center;gap:14px}.hd svg{width:72px;height:72px;flex:none;border-radius:18px}
.hd h2{margin:0;font-size:30px}.hd p{margin:0;color:var(--mu);font-size:14px}
.goal{margin:16px 0;padding:16px;border-radius:16px;color:#F8F8FF;font-size:18px;font-weight:600;text-align:center;background:linear-gradient(90deg,var(--bl),var(--rd),var(--gn))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
.mb{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.mb button{flex:1 0 13%;padding:8px 0;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px;cursor:pointer}
.mb button.a{background:var(--bl);color:#fff;border-color:var(--bl)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--rd),var(--gn))}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{cursor:pointer;text-align:center;padding:18px 8px;border-top:5px solid var(--bl)}
.m:nth-child(2){border-top-color:var(--rd)}.m:nth-child(3){border-top-color:var(--gn)}
.m b{display:block;font-size:17px}.m span{font-size:30px}
.bt{border:0;border-radius:10px;padding:9px 14px;background:var(--rd);color:#fff;cursor:pointer;font-size:14px}
.bk{background:none;border:0;color:var(--bl);font-size:16px;cursor:pointer;padding:6px 0}
.ex{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--bd)}.ex:last-child{border:0}
.ex input{width:22px;height:22px;margin-top:2px;accent-color:var(--gn);flex:none}
.q{padding:10px 0;border-bottom:1px solid var(--bd)}.q small{color:var(--mu);display:block}
.ben{border-left:5px solid var(--gn)}
h3{margin:6px 0}
</style></head><body>
<div id="sp"><h1 class="st">Welcome</h1></div>
<div id="app"></div>
<script>
const L=["A1","A1","A2","A2","B1","B1","B2","B2","C1","C1","C2","C2"];
const P=(s)=>s.split("/").map(x=>{const[a,b]=x.split("|");return[a,b.split(";")]});
const MODES={
speaking:{n:"Speaking",e:"🎤",c:"Speaking turns what you know into what you can use. Talking daily builds fluency, confident pronunciation and quick thinking, the skills a C2 speaker, actor, rapper and public speaker needs most. Record yourself and you will hear your progress.",
m:P("Foundations|Introduce yourself in 60 seconds;Describe your day aloud;Record and replay a 2-minute talk/Storytelling|Tell a childhood story with a clear beginning, middle and end;Retell a news story in your own words;Shadow one minute of a speaker/Opinions|Give a 2-minute opinion with reasons;Argue both sides of one topic;Use 10 discourse markers aloud/Interviews|Answer 10 common interview questions;Interview a friend like a journalist;Record yourself and cut filler words/Pronunciation|Drill stress and rhythm on 20 words;Practise weak forms and connected speech;Read a paragraph aloud and compare/Acting|Perform a short scene with emotion;Say one line angry, calm and joyful;Learn a short monologue/Public Speaking|Deliver a 3-minute speech;Use pauses and emphasis on purpose;Open with a story or a question/Debate|Defend a position for 5 minutes;Rebut a counterargument calmly;Speak 10 minutes on a complex topic/Rap Flow|Freestyle for 2 minutes in English;Write and perform 16 bars with clear diction;Practise rhythm and rhyme/Idioms and Slang|Use 10 new idioms in conversation;Tell a story with natural slang;Switch between formal and casual register/Impromptu|Speak 3 minutes on a random topic;Answer surprise questions;Give a short toast/Mastery|Give a 15-minute talk;Host a mock panel or interview;Compare your month 1 recording with now")},
listening:{n:"Listening",e:"🎧",c:"Listening trains your ear for real speech: speed, accents, slang and rhythm. The more you hear, the more you understand and the more natural your own English sounds. Shadowing speakers improves pronunciation, which is essential for C2.",
m:P("BBC Learning English|Listen to a 6 Minute English episode twice;Write 5 key points;Note 10 new words/News Bulletins|Summarise today's headlines aloud;Dictate one minute of news;Shadow one report/TED Talks|Watch a talk and list its main argument;Note 5 useful phrases;Retell it in 2 minutes/Podcasts|Follow a podcast at normal speed;Write a short summary;Spot opinion words/Interviews|Identify the speaker's opinion and tone;Note how questions are asked;Shadow a short answer/Films with Subtitles|Watch a scene with English subtitles;Repeat key lines;Learn 5 expressions/Accents|Compare British, American and Australian speech;Note 5 pronunciation differences;Imitate one accent/Documentaries|Watch without subtitles;Write 5 facts you learned;Explain it aloud/Song Listening|Transcribe a verse by ear;Check what you missed;Learn 5 phrases from it/Speeches|Analyse a famous speech's rhetoric;Find 3 repeated patterns;Shadow one minute/Fast Speech|Listen to fast, casual conversation;Note slang and reductions;Replay until you catch it all/Mastery|Watch a film without subtitles;Summarise plot and characters;Discuss the themes aloud")},
reading:{n:"Reading",e:"📖",c:"Reading gives you rich vocabulary, grammar in context and the style of strong writers. Journalists, songwriters and speakers all borrow from what they read. Daily reading builds the range C2 demands.",
m:P("Short News|Read 3 short news articles;Summarise each in 2 sentences;Learn 10 words/Magazines|Read one feature article;State the author's main point;Collect 10 collocations/Opinion Columns|Read a column and find the author's view;List the arguments;Write a short reply/Biographies|Read a chapter about a great communicator;Note key turning points;Learn 10 words/Novels|Read 2 chapters of a novel;Describe a character;Guess new words from context/Movie Scripts|Read a scene aloud;Note how dialogue sounds natural;Act it out/Long-form Journalism|Read an in-depth report;Map its structure;Summarise in 5 sentences/Research Articles|Read an abstract and introduction;Find the main claim;Explain it simply/Poetry and Lyrics|Read a poem closely;Discuss imagery and rhythm;Write your own response/Classic Literature|Read a classic chapter;Note formal vocabulary;Paraphrase a page/Speeches in Print|Read a famous speech;Mark persuasive devices;Rewrite one paragraph/Mastery|Read a hard book chapter;Summarise and critique it;Learn 20 words")},
writing:{n:"Writing",e:"✍️",c:"Writing makes you slow down and be precise. It fixes grammar, builds vocabulary and sharpens your style, which is the heart of journalism and songwriting. Clear writing leads to clear speaking.",
m:P("Journal|Write 5 sentences daily;Use past, present and future;Fix your own mistakes/Paragraphs|Write a paragraph with a topic sentence;Use 10 connectors;Edit for clarity/Essays|Write a 300-word essay;Plan intro, body and conclusion;Add a counterargument/News Articles|Write a report using who, what, where, when, why;Craft a strong headline;Keep it factual/Short Stories|Write a 400-word story;Show, don't tell;Add dialogue/Opinion Pieces|Write a 400-word opinion article;Support points with evidence;End with a call to action/Movie Reviews|Review a film in 300 words;Describe plot without spoilers;Give a clear verdict/Song Lyrics|Write a verse and chorus;Use imagery and rhyme;Revise for rhythm/Interviews|Write up an interview as an article;Choose the best quotes;Open with a hook/Formal Writing|Write a formal email and a letter;Use polite, precise phrasing;Proofread twice/Speeches|Write a 3-minute speech;Use repetition and contrast;Read it aloud and edit/Mastery|Build a portfolio of your best pieces;Polish one to publishable level;Write a reflection on your progress")}
};
const Q="The only thing we have to fear is fear itself.~Franklin D. Roosevelt/I have a dream today!~Martin Luther King Jr./Injustice anywhere is a threat to justice everywhere.~Martin Luther King Jr./Darkness cannot drive out darkness; only light can do that.~Martin Luther King Jr./The time is always right to do what is right.~Martin Luther King Jr./Our lives begin to end the day we become silent about things that matter.~Martin Luther King Jr./Never, never, never give up.~Winston Churchill/We shall never surrender.~Winston Churchill/Courage is what it takes to stand up and speak.~Winston Churchill/This was their finest hour.~Winston Churchill/Short words are best, and the old words when short are best of all.~Winston Churchill/Education is the most powerful weapon which you can use to change the world.~Nelson Mandela/It always seems impossible until it’s done.~Nelson Mandela/Courage was not the absence of fear, but the triumph over it.~Nelson Mandela/If you talk to a man in a language he understands, that goes to his head.~Nelson Mandela/Government of the people, by the people, for the people.~Abraham Lincoln/A house divided against itself cannot stand.~Abraham Lincoln/With malice toward none, with charity for all.~Abraham Lincoln/Ask not what your country can do for you.~John F. Kennedy/We choose to go to the Moon.~John F. Kennedy/Yes, we can.~Barack Obama/We are the change that we seek.~Barack Obama/Tear down this wall!~Ronald Reagan/The lady’s not for turning.~Margaret Thatcher/Speak softly and carry a big stick.~Theodore Roosevelt/Believe you can and you’re halfway there.~Theodore Roosevelt/Be the change that you wish to see in the world.~Mahatma Gandhi (attributed)/An eye for an eye makes the whole world blind.~Mahatma Gandhi (attributed)/Education is the passport to the future.~Malcolm X/By any means necessary.~Malcolm X/If there is no struggle, there is no progress.~Frederick Douglass/It is easier to build strong children than to repair broken men.~Frederick Douglass/Ain’t I a woman?~Sojourner Truth/Failure is impossible.~Susan B. Anthony/No one can make you feel inferior without your consent.~Eleanor Roosevelt/The future belongs to those who believe in the beauty of their dreams.~Eleanor Roosevelt/There is no greater agony than bearing an untold story inside you.~Maya Angelou/Still I rise.~Maya Angelou/People will forget what you said, but never how you made them feel.~Maya Angelou (attributed)/One child, one teacher, one book, one pen can change the world.~Malala Yousafzai/I raise up my voice so those without a voice can be heard.~Malala Yousafzai/Turn your wounds into wisdom.~Oprah Winfrey/Stay hungry, stay foolish.~Steve Jobs/Your time is limited, so don’t waste it living someone else’s life.~Steve Jobs/You can make more friends in two months by becoming interested in other people.~Dale Carnegie/Inaction breeds doubt and fear. Action breeds confidence and courage.~Dale Carnegie/The difference between the almost right word and the right word is really a large matter.~Mark Twain/The right word may be effective, but no word was ever as effective as a rightly timed pause.~Mark Twain (attributed)/Excellence is not an act but a habit.~Aristotle (attributed)/Well begun is half done.~Aristotle/The only true wisdom is in knowing you know nothing.~Socrates (attributed)/A room without books is like a body without a soul.~Cicero (attributed)/Gratitude is not only the greatest of virtues, but the parent of all others.~Cicero/Small opportunities are often the beginning of great enterprises.~Demosthenes/All the world’s a stage.~William Shakespeare/Brevity is the soul of wit.~William Shakespeare/We know what we are, but know not what we may be.~William Shakespeare/Float like a butterfly, sting like a bee.~Muhammad Ali/Service to others is the rent you pay for your room here on earth.~Muhammad Ali/I am the greatest.~Muhammad Ali/If you are neutral in situations of injustice, you have chosen the side of the oppressor.~Desmond Tutu/Do your little bit of good where you are.~Desmond Tutu/Fight for the things you care about, but do it in a way that will lead others to join you.~Ruth Bader Ginsburg/If not now, when?~Hillel the Elder/Courage starts with showing up and letting ourselves be seen.~Brené Brown/People don’t buy what you do; they buy why you do it.~Simon Sinek/Give me liberty, or give me death!~Patrick Henry/I hear and I forget. I see and I remember. I do and I understand.~Confucius (attributed)/A journey of a thousand miles begins with a single step.~Lao Tzu/Luck is what happens when preparation meets opportunity.~Seneca (attributed)/You have power over your mind, not outside events.~Marcus Aurelius/Nothing great was ever achieved without enthusiasm.~Ralph Waldo Emerson/Be water, my friend.~Bruce Lee/If there’s a book you want to read that hasn’t been written yet, you must write it.~Toni Morrison/The single story creates stereotypes.~Chimamanda Ngozi Adichie/Stories can break the dignity of a people, but stories can also repair that broken dignity.~Chimamanda Ngozi Adichie/What you do makes a difference, and you have to decide what kind of difference you want to make.~Jane Goodall/You are never too small to make a difference.~Greta Thunberg/I would like to be remembered as a person who wanted to be free.~Rosa Parks/Nobody need wait a single moment before starting to improve the world.~Anne Frank/Alone we can do so little; together we can do so much.~Helen Keller/Peace begins with a smile.~Mother Teresa/The most important thing in communication is hearing what isn’t said.~Peter Drucker/The single biggest problem in communication is the illusion that it has taken place.~George Bernard Shaw (attributed)/Be yourself; everyone else is already taken.~Oscar Wilde (attributed)/Sí, se puede.~César Chávez/Be kind whenever possible. It is always possible.~Dalai Lama/Creativity is as important now in education as literacy.~Ken Robinson/The most difficult thing is the decision to act.~Amelia Earhart/The way to get started is to quit talking and begin doing.~Walt Disney (attributed)/You must do the thing you think you cannot do.~Eleanor Roosevelt/A good head and a good heart are always a formidable combination.~Nelson Mandela/If you don’t like something, change it.~Maya Angelou/Wise men speak because they have something to say; fools because they have to say something.~Plato (attributed)/Let us never negotiate out of fear. But let us never fear to negotiate.~John F. Kennedy";
const QS=Q.split("/").map(x=>x.split("~"));
let S={m:1,d:{}},rc=0;
try{S=JSON.parse(localStorage.getItem("a1c2"))||S}catch(e){}
const sv=()=>{try{localStorage.setItem("a1c2",JSON.stringify(S))}catch(e){}};
const icon=()=>`<svg viewBox="0 0 120 120" aria-label="LingoRise"><defs><clipPath id="cp"><rect width="120" height="120" rx="26"/></clipPath></defs><g clip-path="url(#cp)"><rect width="40" height="120" fill="#1e63e9"/><rect x="40" width="40" height="120" fill="#e02b2b"/><rect x="80" width="40" height="120" fill="#1fa84f"/></g><text class="st" x="8" y="68" textLength="104" lengthAdjust="spacingAndGlyphs" font-size="22" fill="#F8F8FF">LingoRise</text></svg>`;
const mbar=()=>`<div class="card"><b>Month ${S.m} of 12 · Level ${L[S.m-1]} → C2</b><div class="bar" style="margin:8px 0"><i style="width:${S.m/12*100}%"></i></div><div class="mb">${[...Array(12)].map((_,i)=>`<button class="${i+1==S.m?"a":""}" onclick="gm(${i+1})">${i+1}</button>`).join("")}</div><button class="bt" onclick="rs()">${rc?"Tap again to reset to Month 1":"Reset to Month 1"}</button></div>`;
function gm(n){S.m=n;sv();rc=0;go(cur)}
function rs(){if(!rc){rc=1;go(cur);return}S={m:1,d:{}};sv();rc=0;go(cur)}
function tg(k){S.d[k]=!S.d[k];sv()}
let cur="home";
function go(v){cur=v;const a=document.getElementById("app");let h="";
if(v=="home"){h=`<div class="hd">${icon()}<div><h2 class="st">LingoRise</h2><p>12 months. One goal.</p></div></div><div class="goal">“I am going to become a great Communicator.”</div>${mbar()}<div class="g">${Object.keys(MODES).map(k=>`<div class="card m" onclick="go('${k}')"><span>${MODES[k].e}</span><b>${MODES[k].n}</b></div>`).join("")}</div><div class="card m" style="border-top-color:var(--rd)" onclick="go('quotes')"><span>💬</span><b>100 Great Communicators’ Quotes</b></div>`}
else if(v=="quotes"){h=`<button class="bk" onclick="go('home')">← Back</button><h3>100 Quotes from Great Communicators</h3><p style="color:var(--mu);font-size:14px">Some quotes are traditionally attributed, and wording can vary by source.</p><div class="card">${QS.map((q,i)=>`<div class="q">${i+1}. “${q[0]}”<small>— ${q[1]}</small></div>`).join("")}</div>`}
else{const M=MODES[v],t=M.m[S.m-1];h=`<button class="bk" onclick="go('home')">← Back</button><h3>${M.e} ${M.n}</h3><div class="card ben">${M.c}</div>${mbar()}<div class="card"><b>Month ${S.m}: ${t[0]}</b>${t[1].map((x,i)=>{const k=v+S.m+"-"+i;return`<label class="ex"><input type="checkbox" ${S.d[k]?"checked":""} onchange="tg('${k}')"><span>${x}</span></label>`}).join("")}</div>`}
a.innerHTML=h;window.scrollTo(0,0)}
go("home");
setTimeout(()=>{document.getElementById("app").classList.add("on");const s=document.getElementById("sp");s.style.opacity=0;setTimeout(()=>s.remove(),1000)},4400);
</script></body></html>
